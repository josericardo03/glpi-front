name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Nome da imagem
        id: nome
        run: echo "imagem=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no registro do GitHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://127.0.0.1:3000/api' }}
            NEXT_PUBLIC_USE_MOCKS=${{ vars.NEXT_PUBLIC_USE_MOCKS || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  atualizar:
    needs: imagem
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o container no servidor
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd "${{ vars.DEPLOY_PATH || '/opt/glpi-front' }}"
            docker compose pull
            docker compose up -d
