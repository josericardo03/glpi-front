services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm}
      POSTGRES_DB: itsm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/josericardo03/glpi-back:latest
    build:
      context: ../glpi-back
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://itsm:${POSTGRES_PASSWORD:-itsm}@postgres:5432/itsm
      DIRECT_URL: postgresql://itsm:${POSTGRES_PASSWORD:-itsm}@postgres:5432/itsm
      JWT_SECRET: ${JWT_SECRET:-troque-por-pelo-menos-32-caracteres-aleatorios}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@itsm.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123456}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/josericardo03/glpi-front:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    environment:
      PORT: "5173"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
