services:
  web:
    image: ghcr.io/josericardo03/glpi-front:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3000/api}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    ports:
      - "5173:5173"
    environment:
      PORT: "5173"
      HOSTNAME: "0.0.0.0"
